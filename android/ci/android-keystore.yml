name: NINO create signing key (run once)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keystore:
    runs-on: ubuntu-latest
    env:
      SIGN_PASS: ${{ secrets.NINO_SIGN_PASS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check before creating
        run: |
          if [ -z "$SIGN_PASS" ]; then echo "::error::ยังไม่ได้ตั้ง secret ชื่อ NINO_SIGN_PASS"; exit 1; fi
          if [ "${#SIGN_PASS}" -lt 16 ]; then echo "::error::รหัสสั้นเกินไป ต้องยาว 16 ตัวอักษรขึ้นไป"; exit 1; fi
          if [ -f android/signing/nino.jks.enc ]; then echo "::error::มีกุญแจอยู่แล้ว ห้ามสร้างทับ เพราะจะอัปเดตทับแอปเดิมไม่ได้"; exit 1; fi

      - name: Create key, encrypt it, commit only the encrypted file
        run: |
          keytool -genkeypair -keystore nino.jks -storetype PKCS12 -alias nino -keyalg RSA -keysize 4096 -validity 36500 \
            -storepass:env SIGN_PASS -keypass:env SIGN_PASS -dname "CN=NINO, O=NINO, C=TH"
          mkdir -p android/signing
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:SIGN_PASS -in nino.jks -out android/signing/nino.jks.enc
          rm -f nino.jks
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/signing/nino.jks.enc
          git commit -m "Add encrypted NINO signing key"
          git push origin HEAD
